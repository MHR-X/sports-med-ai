<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - SportsMed AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /*
          نفس هوية "غرفة الفحص ليلاً": أرضية زيتية داكنة + شبكة قياس خفيفة،
          وبطاقة ورقية معلّقة بمشبك كليب-بورد فوقها، وشريط نبض (EKG) يرسم نفسه
          عند التحميل مع نقطة تتحرك فوق المسار، ولاصق ورقي (tape) في الزاوية.
        */
        :root {
            --field: #14140f;
            --field-2: #1a1a13;
            --panel-2: #23231a;
            --line: #34342a;
            --line-soft: rgba(239, 232, 216, 0.08);

            --paper: #efe8d8;
            --paper-2: #f7f2e6;
            --ink: #221e15;
            --ink-soft: #5b5546;

            --clay: #b3432a;
            --clay-hover: #c74f34;
            --clay-glow: rgba(179, 67, 42, 0.35);

            --sage: #4c6b5c;
            --sage-bright: #6f9482;
            --sage-glow: rgba(111, 148, 130, 0.3);

            --tape: #cf9a3e;

            --text-onfield: #e9e3d2;
            --text-onfield-dim: #a49c85;

            --shadow-deep: 0 22px 54px rgba(0, 0, 0, 0.5);
            --shadow-paper: 0 10px 26px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--field);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 40px 16px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
            background-size: 34px 34px;
            -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(111, 148, 130, 0.12) 0%, transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(179, 67, 42, 0.12) 0%, transparent 45%);
            animation: bgBreathe 9s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes bgBreathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* ============ اللوحة: كليب-بورد يحمل ورقة الفحص ============ */
        .auth-shell {
            position: relative;
            width: 100%;
            max-width: 430px;
            z-index: 1;
            animation: shellDrop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1.15) both;
        }

        @keyframes shellDrop {
            from { opacity: 0; transform: translateY(-26px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .clip {
            position: relative;
            width: 130px;
            height: 26px;
            margin: 0 auto -13px;
            z-index: 3;
            border-radius: 6px;
            background: linear-gradient(180deg, #4b4b40 0%, #2b2b24 55%, #1c1c17 100%);
            box-shadow: var(--shadow-deep);
        }

        .clip::before, .clip::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6b6a5c, #201f19 70%);
            transform: translateY(-50%);
        }

        .clip::before { right: 16px; }
        .clip::after { left: 16px; }

        .tape {
            position: absolute;
            top: -6px;
            right: 34px;
            width: 78px;
            height: 26px;
            background: linear-gradient(100deg, rgba(111, 148, 130, 0.92), rgba(111, 148, 130, 0.72));
            transform: rotate(6deg);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            z-index: 4;
            opacity: 0.9;
        }

        .tape::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.18) 0 2px, transparent 2px 6px);
        }

        .chart-card {
            position: relative;
            background: var(--paper);
            border-radius: 4px 4px 18px 18px;
            box-shadow: var(--shadow-deep);
            padding: 40px 36px 34px;
            color: var(--ink);
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 1px;
            background-image: repeating-linear-gradient(90deg, rgba(34,30,21,0.28) 0 6px, transparent 6px 14px);
        }

        .patient-tag {
            position: absolute;
            top: 16px;
            right: 36px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--ink-soft);
            background: rgba(179, 67, 42, 0.1);
            border: 1px solid rgba(179, 67, 42, 0.3);
            padding: 3px 9px;
            border-radius: 20px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--clay);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 26px var(--clay-glow);
            margin-bottom: 16px;
            color: var(--paper-2);
        }

        .logo-icon svg { width: 30px; height: 30px; }

        h1 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--ink);
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--sage);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .pulse-wrap {
            margin: 18px 0 20px;
            padding: 10px 6px;
            background: rgba(34, 30, 21, 0.045);
            border-radius: 10px;
            border: 1px dashed rgba(34, 30, 21, 0.16);
        }

        .pulse-wrap svg { width: 100%; height: 34px; display: block; }

        .pulse-path {
            fill: none;
            stroke: var(--sage);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawPulse 1.5s ease-out 0.35s forwards;
        }

        @keyframes drawPulse { to { stroke-dashoffset: 0; } }

        .pulse-dot {
            r: 3.4;
            fill: var(--clay);
            offset-path: path('M2,17 L34,17 L42,4 L50,30 L58,17 L300,17');
            animation: travel 2.6s linear 1.9s infinite, dotPulse 0.9s ease-in-out 1.9s infinite;
        }

        @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
        @keyframes dotPulse { 0%, 100% { r: 3.4; } 50% { r: 5; } }

        .error {
            background: rgba(179, 67, 42, 0.1);
            color: var(--clay);
            border: 1px solid rgba(179, 67, 42, 0.35);
            border-right: 4px solid var(--clay);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.5s ease;
        }

        .error svg { width: 16px; height: 16px; flex-shrink: 0; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 13px;
        }

        label svg { width: 14px; height: 14px; color: var(--sage); }

        .field { position: relative; }

        input {
            width: 100%;
            padding: 13px 16px;
            background: var(--paper-2);
            border: 1.5px solid rgba(34, 30, 21, 0.16);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Tajawal', sans-serif;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input:focus {
            border-color: var(--sage-bright);
            box-shadow: 0 0 0 4px var(--sage-glow);
            background: #fffdf7;
        }

        input::placeholder { color: var(--ink-soft); opacity: 0.7; }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: var(--clay);
            color: var(--paper-2);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 22px var(--clay-glow);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        button[type="submit"] svg { width: 18px; height: 18px; }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: -120%;
            width: 60%; height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
            transition: left 0.55s ease;
        }

        button[type="submit"]:hover::before { left: 130%; }

        button[type="submit"]:hover {
            background: var(--clay-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--clay-glow);
        }

        button[type="submit"]:active { transform: translateY(0); }

        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 2px solid var(--sage-bright);
            outline-offset: 2px;
        }

        .switch-link {
            text-align: center;
            margin-top: 22px;
            color: var(--ink-soft);
            font-size: 14px;
            padding-top: 16px;
            border-top: 1px dashed rgba(34, 30, 21, 0.16);
        }

        .switch-link a {
            color: var(--sage);
            text-decoration: none;
            font-weight: 800;
            transition: color 0.2s ease;
        }

        .switch-link a:hover { color: var(--clay); text-decoration: underline; }

        @media (max-width: 480px) {
            .chart-card { padding: 32px 22px 26px; }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="clip"></div>
        <div class="chart-card">
            <div class="tape"></div>
            <span class="patient-tag">RETURNING · PATIENT</span>

            <div class="brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-6.7-4.35-9.3-8.6C.8 8.7 2.1 5 5.6 4.2 8 3.6 10 4.8 12 7.2c2-2.4 4-3.6 6.4-3 3.5.8 4.8 4.5 2.9 8.2C18.7 16.65 12 21 12 21Z"/>
                        <path d="M4 12h3l1.6-3 2.2 6 1.6-4 1.2 2H20"/>
                    </svg>
                </div>
                <h1>SportsMed AI</h1>
                <span class="subtitle">المساعد الطبي الذكي</span>
            </div>

            <div class="pulse-wrap" aria-hidden="true">
                <svg viewBox="0 0 300 34" preserveAspectRatio="none">
                    <path class="pulse-path" d="M2,17 L34,17 L42,4 L50,30 L58,17 L300,17"/>
                    <circle class="pulse-dot" cx="0" cy="0"/>
                </svg>
            </div>

            {% if error %}
            <div class="error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        البريد الإلكتروني
                    </label>
                    <div class="field">
                        <input type="email" name="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        كلمة السر
                    </label>
                    <div class="field">
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
                    تسجيل الدخول
                </button>
            </form>

            <div class="switch-link">
                ليس لديك حساب؟ <a href="{{ url_for('register') }}">سجل الآن</a>
            </div>
        </div>
    </div>
</body>
</html>
